<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1a1a1a);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #2a2a2a);
            --blue: #32a852; /* Balans kartasi rangi */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .balance-card {
            background: linear-gradient(135deg, #1cb5e0 0%, #000851 100%);
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .balance-title { font-size: 14px; opacity: 0.8; margin-bottom: 5px; }
        .balance-amount { font-size: 32px; font-weight: bold; margin-bottom: 15px; }
        .btn-fill {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        .category-list { display: flex; flex-direction: column; gap: 12px; }
        .category-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .category-info { display: flex; align-items: center; gap: 12px; }
        .category-icon { font-size: 24px; }
        .category-name { font-size: 16px; font-weight: 500; }
        #admin-btn {
            display: none;
            width: 100%;
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="balance-card">
        <div class="balance-title">BALANS</div>
        <div class="balance-amount"><span id="user-balance">0</span> so'm</div>
        <button class="btn-fill">+ To'ldirish</button>
    </div>

    <div class="category-list" id="category-container">
        <!-- Kategoriyalar shu yerga JavaScript orqali tushadi -->
        <div style="text-align:center; padding:20px;">Yuklanmoqda...</div>
    </div>

    <button id="admin-btn" onclick="openAdminPanel()">⚙️ Admin Panelga kirish</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        const categoryContainer = document.getElementById('category-container');

        if (user) {
            // 1. Foydalanuvchini bazadan tekshirish va balansni olish
            fetch('/api/user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramId: user.id.toString(), firstName: user.first_name })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('user-balance').innerText = data.user.balance;
                    // Agar kirgan odam admin bo'lsa, tugmani ko'rsatish
                    if (data.user.role === 'admin') {
                        document.getElementById('admin-btn').style.display = 'block';
                    }
                }
            });

            // 2. Kategoriyalarni yuklash
            fetch('/api/categories')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    categoryContainer.innerHTML = '';
                    if (data.categories.length === 0) {
                        categoryContainer.innerHTML = '<div style="text-align:center; color:gray;">Hozircha bo\'limlar yo\'q</div>';
                    }
                    data.categories.forEach(cat => {
                        const item = document.createElement('div');
                        item.className = 'category-item';
                        item.innerHTML = `
                            <div class="category-info">
                                <span class="category-icon">${cat.icon || '📁'}</span>
                                <span class="category-name">${cat.name}</span>
                            </div>
                            <span>›</span>
                        `;
                        categoryContainer.appendChild(item);
                    });
                }
            });
        } else {
            categoryContainer.innerHTML = 'Faqat Telegram orqali kirish mumkin.';
        }

        function openAdminPanel() {
            // Admin panel sahifasiga o'tish
            window.location.href = '/admin.html';
        }
    </script>
</body>
</html>
